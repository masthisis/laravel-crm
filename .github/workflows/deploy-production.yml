name: Deploy (production)

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.PROD_DEPLOY_ENABLED == 'true' }}

    steps:
      - name: Deploy over SSH
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: RELEASE_TAG
          script: |
            set -e
            cd ${{ vars.PROD_PATH }}
            git fetch --all --tags
            git checkout "$RELEASE_TAG"
            docker compose -f docker-compose.production.yml pull app worker scheduler
            docker compose -f docker-compose.production.yml build nginx
            docker compose -f docker-compose.production.yml up -d
            docker compose -f docker-compose.production.yml exec -T app php artisan migrate --force
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Deployment summary
        run: echo "Production deployed from release ${{ github.event.release.tag_name }}"
